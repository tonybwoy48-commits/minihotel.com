<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MiniHotel Kumasi</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}body{background:#f8fafc}.nav{background:#fff;border-bottom:1px solid #e2e8f0;padding:14px 18px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}.logo{font-weight:900;display:flex;gap:8px;align-items:center}.logoBox{width:32px;height:32px;background:#0f172a;color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center}.btn{padding:10px 14px;border-radius:10px;border:none;font-weight:700;font-size:12px;cursor:pointer}.ghost{background:#f1f5f9}.primary{background:#0f172a;color:#fff}.hero{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:36px 18px;text-align:center}.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;padding:16px;max-width:1100px;margin:0 auto}.roomCard{background:#fff;border:1px solid #e2e8f0;border-radius:18px;overflow:hidden}.roomImg{height:150px;background-size:cover;background-position:center}.roomBody{padding:14px}</style></head><body>
<div class="nav"><div class="logo"><div class="logoBox">M</div>MiniHotel Kumasi</div><div><button class="btn ghost" onclick="location.href='login.html'">Login</button><button class="btn primary" onclick="location.href='register.html'">Create Account</button></div></div>
<div class="hero"><h1>Luxury & Comfort in Kumasi</h1><p style="opacity:.7;margin:8px 0 14px;font-size:13px">Book → Create Account → Pay (Momo/Cash) → Admin Approves → WiFi</p><button class="btn" style="background:#fff;color:#0f172a" onclick="document.getElementById('rooms').scrollIntoView({behavior:'smooth'})">See Rooms & Prices ↓</button></div>
<div id="rooms" class="rooms"></div>
<script>
let prices=JSON.parse(localStorage.getItem('roomPrices')||'{"Standard":180,"Deluxe":250,"Executive":300,"Suite":450}');
let rooms=[{t:'Standard',n:'Standard Room',d:'1 Bed • 2 Guests • Free WiFi',i:'https://images.unsplash.com/photo-1631049307264-da0ec9d70304?w=600'},{t:'Deluxe',n:'Deluxe Room',d:'King • City View',i:'https://images.unsplash.com/photo-1611892440504-42a792e24d32?w=600'},{t:'Executive',n:'Executive Room',d:'Work Desk • Balcony',i:'https://images.unsplash.com/photo-1590490360182-c33d57733427?w=600'},{t:'Suite',n:'Luxury Suite',d:'2 Rooms • Jacuzzi',i:'https://images.unsplash.com/photo-1578683010236-d716f9a3f461?w=600'}];
function render(){document.getElementById('rooms').innerHTML=rooms.map(r=>`<div class="roomCard"><div class="roomImg" style="background-image:url('${r.i}')"></div><div class="roomBody"><b>${r.n}</b><br><small style="color:#64748b">${r.d}</small><div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><div><b>GHS ${prices[r.t]}</b><small> /night</small></div><button class="btn primary" onclick="book('${r.t}')">Book Now</button></div></div></div>`).join('');}
function book(t){localStorage.setItem('wantedRoom',t);let cur=JSON.parse(localStorage.getItem('currentUser')||'null');if(cur&&cur.role==='admin')location.href='admin.html';else if(cur)location.href='payment.html';else location.href='register.html?room='+t;}
render();
</script></body></html>
