<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MiniHotel Kumasi</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#f8fafc}.nav{background:#1e293b;color:#fff;padding:12px 16px;display:flex;justify-content:space-between}.btn{padding:8px 14px;border-radius:8px;border:none;font-weight:700;cursor:pointer}.btnT{background:#14b8a6;color:#fff}.card{background:#fff;border-radius:12px;padding:16px;margin:12px;border:1px solid #e2e8f0}.inp{padding:10px;border:1px solid #e2e8f0;border-radius:8px;width:100%;margin:6px 0}</style></head><body>
<div class="nav"><b>🏨 MiniHotel Kumasi</b><div><button onclick="location.href='login.html'" class="btn" style="background:#334155;color:#fff">Login</button> <button onclick="location.href='admin.html'" class="btn btnT">Admin</button></div></div>
<div class="card"><h2>Welcome to MiniHotel</h2><p style="color:#64748b;font-size:13px">Best rooms in Kumasi - Book now pay Momo</p></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:0"><div class="card"><b>Standard Room</b><br><small>GHS <span class="priceS">180</span>/night</small><br><button class="btn btnT" style="margin-top:8px" onclick="book('Standard')">Book Now</button></div><div class="card"><b>Deluxe Room</b><br><small>GHS <span class="priceD">250</span>/night</small><br><button class="btn btnT" style="margin-top:8px" onclick="book('Deluxe')">Book Now</button></div><div class="card"><b>Executive Room</b><br><small>GHS <span class="priceE">300</span>/night</small><br><button class="btn btnT" style="margin-top:8px" onclick="book('Executive')">Book Now</button></div><div class="card"><b>Suite Room</b><br><small>GHS <span class="priceSu">450</span>/night</small><br><button class="btn btnT" style="margin-top:8px" onclick="book('Suite')">Book Now</button></div></div>
<div id="bookModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:99"><div class="card" style="width:90%;max-width:360px"><h3>Book <span id="roomType"></span></h3><input id="gName" class="inp" placeholder="Your Name"><input id="gEmail" class="inp" placeholder="Your Email"><select id="payMethod" class="inp"><option value="momo">MTN Momo</option><option value="cash">Cash at Hotel</option></select><input id="momoNum" class="inp" placeholder="Momo Number: 055..."><button class="btn btnT" style="width:100%" onclick="confirmBook()">Confirm Booking - Pay Now</button><button class="btn" style="width:100%;background:#f1f5f9;margin-top:6px" onclick="document.getElementById('bookModal').style.display='none'">Cancel</button></div></div>
<script>
let curRoom='',curPrice=0;
function book(room){let pr=JSON.parse(localStorage.getItem('roomPrices')||'{"Standard":180,"Deluxe":250,"Executive":300,"Suite":450}');curRoom=room;curPrice=pr[room];document.getElementById('roomType').innerText=room+' - GHS '+curPrice;document.getElementById('bookModal').style.display='flex';}
function confirmBook(){let n=document.getElementById('gName').value,e=document.getElementById('gEmail').value,m=document.getElementById('payMethod').value;if(!n||!e)return alert('Enter name and email');let pays=JSON.parse(localStorage.getItem('payments')||'[]');pays.push({id:'BK'+Date.now(),guest:n,email:e,room:curRoom,amount:curPrice,method:m,status:'pending',time:new Date().toLocaleString()});localStorage.setItem('payments',JSON.stringify(pays));let users=JSON.parse(localStorage.getItem('allUsers')||'[]');if(!users.find(u=>u.email==e)){users.push({name:n,email:e,role:'guest',status:'pending'});localStorage.setItem('allUsers',JSON.stringify(users));}alert('✅ Booking sent! Admin will approve - then you get WiFi. Login with your email to check.');document.getElementById('bookModal').style.display='none';location.href='login.html';}
let pr=JSON.parse(localStorage.getItem('roomPrices')||'{"Standard":180,"Deluxe":250,"Executive":300,"Suite":450}');document.querySelectorAll('.priceS').forEach(el=>el.innerText=pr.Standard);document.querySelectorAll('.priceD').forEach(el=>el.innerText=pr.Deluxe);document.querySelectorAll('.priceE').forEach(el=>el.innerText=pr.Executive);document.querySelectorAll('.priceSu').forEach(el=>el.innerText=pr.Suite);
</script></body></html>
