<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}body{background:#f6f7fb;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}.box{background:#fff;width:100%;max-width:380px;border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.08)}input{width:100%;padding:13px;border:1.5px solid #e5e7eb;border-radius:12px;margin-bottom:12px;font-size:14px}.btn{width:100%;background:#2563eb;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:800;font-size:15px}.msg{display:none;padding:10px;border-radius:10px;font-weight:600;text-align:center;margin-top:12px}.success{background:#dcfce7;color:#166534;display:block}</style></head><body><div class="box"><h2>Welcome Back 👋</h2><p style="color:#6b7280;font-size:13px;margin:8px 0 16px">Kumasi MiniHotel • Ghana</p><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><div id="msg" class="msg"></div><button class="btn" onclick="go()">Login → Guest Page</button><p style="text-align:center;margin-top:14px;font-size:13px"><a href="index.html" style="color:#2563eb;font-weight:700;text-decoration:none">Home</a> • <a href="register.html" style="color:#2563eb;text-decoration:none">Create account</a></p></div><script>function go(){const e=document.getElementById('email').value.trim();if(!e){document.getElementById('msg').innerText='Enter email';document.getElementById('msg').style.display='block';return}const n=localStorage.getItem('guestName')||e.split('@')[0]||'Guest';document.getElementById('msg').className='msg success';document.getElementById('msg').innerText='Welcome back '+n+'! Redirecting...';document.getElementById('msg').style.display='block';setTimeout(()=>location.href='guest.html',800)}</script></body></html>
