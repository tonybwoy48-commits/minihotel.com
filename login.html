<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,system-ui,sans-serif}body{background:#f6f7fb;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}.box{background:#fff;width:100%;max-width:380px;border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.08)}input{width:100%;padding:12px;border:1.5px solid #e5e7eb;border-radius:12px;margin-bottom:12px}.btn{width:100%;background:#2563eb;color:#fff;border:none;padding:13px;border-radius:12px;font-weight:800}</style></head><body><div class="box"><h2>Welcome Back 👋</h2><p style="color:#6b7280;font-size:13px;margin:6px 0 16px">Kumasi MiniHotel • Ghana</p><input id="email" placeholder="Email or +233 Phone"><input id="pass" type="password" placeholder="Password"><button class="btn" onclick="login()">Login</button><p style="text-align:center;margin-top:14px;font-size:13px"><a href="register.html" style="color:#2563eb;font-weight:700;text-decoration:none">No account? Create one</a> • <a href="index.html" style="color:#2563eb;font-weight:700;text-decoration:none">Home</a></p></div><script>function login(){const e=document.getElementById('email').value;if(!e){alert('Enter email/phone');return}const name=localStorage.getItem('guestName')||'Kwame';alert('Welcome back '+name+'!');location.href='index.html'}</script></body></html>
