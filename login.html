<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}body{background:#f8fafc;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}.card{background:#fff;width:100%;max-width:380px;border-radius:20px;padding:20px;border:1px solid #e2e8f0}.inp{width:100%;padding:12px;border:1.5px solid #e2e8f0;border-radius:10px;margin:8px 0}.btn{width:100%;padding:13px;background:#0f172a;color:#fff;border:none;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px}</style></head><body>
<div class="card"><h2 style="text-align:center">MiniHotel Login</h2><p style="text-align:center;color:#64748b;font-size:12px;margin:6px 0 14px">Admin & Guests use same login</p><input id="email" class="inp" placeholder="Email or admin"><input id="pass" class="inp" type="password" placeholder="Password"><button class="btn" onclick="login()">Login</button><p style="text-align:center;font-size:12px;margin-top:12px">No account? <a href="register.html">Create Account</a></p><div style="background:#f8fafc;padding:10px;border-radius:10px;margin-top:12px;font-size:11px"><b>Admin:</b> admin / MiniHotel2026<br><b>Guest:</b> Create account then login</div></div>
<script>
(function(){let users=JSON.parse(localStorage.getItem('allUsers')||'[]');if(!users.find(u=>u.role==='admin')){users.push({name:'Admin',email:'admin',password:'MiniHotel2026',role:'admin',status:'approved'});localStorage.setItem('allUsers',JSON.stringify(users));}})();
function login(){
 let e=document.getElementById('email').value.trim();let p=document.getElementById('pass').value.trim();
 let adminU=localStorage.getItem('adminUser')||'admin';let adminP=localStorage.getItem('adminPass')||'MiniHotel2026';
 if((e===adminU&&p===adminP)||(e==='admin'&&p==='MiniHotel2026')){localStorage.setItem('adminLoggedIn','true');localStorage.setItem('currentUser',JSON.stringify({name:'Admin',email:'admin',role:'admin',status:'approved'}));location.href='admin.html?v=final';return;}
 let users=JSON.parse(localStorage.getItem('allUsers')||'[]');let u=users.find(x=>(x.email===e||x.name===e)&&x.password===p);
 if(u){localStorage.setItem('currentUser',JSON.stringify(u));if(u.role==='admin'){localStorage.setItem('adminLoggedIn','true');location.href='admin.html?v=final';}else{if(u.status==='pending_payment')location.href='payment.html';else location.href='guest.html?v=final';}}else alert('Wrong email or password');
}
</script></body></html>
