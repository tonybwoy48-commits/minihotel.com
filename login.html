<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - MiniHotel</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,system-ui,sans-serif}body{background:#f6f7fb;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}.box{background:#fff;width:100%;max-width:380px;border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.08)}h2{font-size:22px}label{font-size:12px;font-weight:700;margin:12px 0 6px;display:block;color:#374151}input{width:100%;padding:13px;border:1.5px solid #e5e7eb;border-radius:12px;font-size:14px;outline:none}input:focus{border-color:#2563eb}.btn{width:100%;background:#2563eb;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:800;margin-top:16px;font-size:15px}.btn:active{transform:scale(.98)}.msg{padding:10px;border-radius:10px;font-size:13px;font-weight:600;text-align:center;display:none;margin-top:12px}.success{background:#dcfce7;color:#166534;display:block}.error{background:#fee2e2;color:#991b1b;display:block}</style></head><body>
<div class="box">
<h2>Welcome Back 👋</h2>
<p style="color:#6b7280;font-size:13px;margin:6px 0 18px">Kumasi MiniHotel • Ghana</p>

<label>Email or Phone</label>
<input id="email" placeholder="yaw@gmail.com or +233...">

<label>Password</label>
<input id="pass" type="password" placeholder="Your password">

<div id="msg" class="msg"></div>

<button class="btn" onclick="login()">Login → Guest Page</button>

<p style="text-align:center;margin-top:16px;font-size:13px">
<a href="register.html" style="color:#2563eb;font-weight:700;text-decoration:none">No account? Create one</a> • <a href="index.html" style="color:#2563eb;font-weight:700;text-decoration:none">Home</a>
</p>
</div>

<script>
function login(){
 const e = document.getElementById('email').value.trim();
 const p = document.getElementById('pass').value.trim();
 const m = document.getElementById('msg');
 
 if(!e || !p){ m.className='msg error'; m.innerText='Enter email/phone and password'; m.style.display='block'; return; }
 
 // Get saved name
 const savedName = localStorage.getItem('guestName') || 'Yaw';
 
 // Show success WITHOUT alert popup
 m.className='msg success';
 m.innerText = 'Welcome back ' + savedName + '! Loading your room...';
 m.style.display='block';
 
 // Go directly to guest page after 800ms — no popup!
 setTimeout(()=>{ location.href='guest.html'; }, 800);
}
</script>
</body></html>
