<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#f1f5f9;display:flex;min-height:100vh;align-items:center;justify-content:center}.card{background:#fff;padding:24px;border-radius:16px;width:90%;max-width:360px;border:1px solid #e2e8f0}.inp{padding:10px;border:1px solid #e2e8f0;border-radius:8px;width:100%;margin:8px 0}.btn{padding:10px;border:none;border-radius:8px;width:100%;font-weight:700;cursor:pointer}.btnT{background:#14b8a6;color:#fff}</style></head><body>
<div class="card"><h2>🏨 MiniHotel Login</h2><small style="color:#64748b">Admin: admin@hotel.com / admin123<br>Guest: use your booking email</small><input id="email" class="inp" placeholder="Email" value="admin@hotel.com"><input id="pass" class="inp" type="password" placeholder="Password" value="admin123"><button class="btn btnT" onclick="login()">Login</button><div style="text-align:center;margin-top:10px"><a href="index.html" style="font-size:12px;color:#64748b">← Back Home</a></div></div>
<script>
function login(){let e=email.value,p=pass.value;if(e=='admin@hotel.com'&&p=='admin123'){localStorage.setItem('currentUser',JSON.stringify({email:e,role:'admin'}));location.href='admin.html';return;}let users=JSON.parse(localStorage.getItem('allUsers')||'[]');let u=users.find(x=>x.email==e);if(u){localStorage.setItem('currentUser',JSON.stringify(u));location.href='guest.html';}else alert('❌ No booking found for this email. Book first on Home page.');}
</script></body></html>
