<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Payment</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}body{background:#f8fafc;padding:14px;max-width:480px;margin:0 auto}.card{background:#fff;border-radius:18px;padding:14px;border:1px solid #e2e8f0;margin-bottom:12px}.opt{border:2px solid #e2e8f0;border-radius:12px;padding:12px;margin:8px 0;display:flex;gap:10px;cursor:pointer}.opt.active{border-color:#2563eb;background:#eff6ff}.inp{width:100%;padding:11px;border:1px solid #e2e8f0;border-radius:10px;margin:6px 0}.btn{width:100%;padding:14px;background:#0f172a;color:#fff;border:none;border-radius:12px;font-weight:800;cursor:pointer}</style></head><body>
<div style="text-align:center;padding:10px"><b>MiniHotel - Payment</b><br><small id="roomTxt">Standard Room</small> - <b id="priceTxt">GHS 540</b></div>
<div class="card"><b>Payment Method</b>
<div class="opt active" id="optMomo" onclick="sel('momo')"><div>●</div><div><b>📱 Momo Pay</b><br><small>MTN 055 123 4567 - MiniHotel</small></div></div>
<div class="opt" id="optCash" onclick="sel('cash')"><div>○</div><div><b>💵 Cash at Hotel</b><br><small>Pay at front desk Kumasi</small></div></div></div>
<div class="card" id="momoBox"><b>Momo Details</b><div style="background:#fef9c3;padding:8px;border-radius:8px;margin:8px 0;font-size:11px">Send to: <b>055 123 4567</b><br>Ref: <b id="ref">MINI123</b><br>Amount: <b id="amt">GHS 540</b></div><input id="mNum" class="inp" placeholder="Your Momo Number"><input id="tId" class="inp" placeholder="Transaction ID after sending"></div>
<div class="card" id="cashBox" style="display:none"><b>Cash at Hotel</b><p style="font-size:12px;margin:6px 0">Come to front desk with cash. Select arrival date:</p><input id="arr" class="inp" type="date"></div>
<button class="btn" onclick="submitPay()">Submit Payment → Wait Admin Approval</button>
<script>
let method='momo',room='Standard',price=180;
(function(){room=localStorage.getItem('wantedRoom')||'Standard';let pr=JSON.parse(localStorage.getItem('roomPrices')||'{"Standard":180}');price=pr[room]||180;let total=price*3;document.getElementById('roomTxt').innerText=room+' (3 Nights)';document.getElementById('priceTxt').innerText='GHS '+total;document.getElementById('amt').innerText='GHS '+total;let cur=JSON.parse(localStorage.getItem('currentUser')||'{}');document.getElementById('ref').innerText='MINI-'+(cur.name||'GUEST').substr(0,3).toUpperCase()+Math.floor(Math.random()*900);})();
function sel(m){method=m;document.getElementById('optMomo').classList.toggle('active',m==='momo');document.getElementById('optCash').classList.toggle('active',m==='cash');document.getElementById('momoBox').style.display=m==='momo'?'block':'none';document.getElementById('cashBox').style.display=m==='cash'?'block':'none';}
function submitPay(){let cur=JSON.parse(localStorage.getItem('currentUser')||'null');if(!cur)return location.href='login.html';let pays=JSON.parse(localStorage.getItem('payments')||'[]');pays.push({id:'PAY'+Date.now(),guest:cur.name,email:cur.email,room:room,amount:price*3,method:method,momoNum:document.getElementById('mNum').value,transId:document.getElementById('tId').value,arrival:document.getElementById('arr').value,status:'pending',time:new Date().toLocaleString()});localStorage.setItem('payments',JSON.stringify(pays));let users=JSON.parse(localStorage.getItem('allUsers')||'[]');users=users.map(u=>{if(u.email===cur.email)u.status='pending_approval';return u;});localStorage.setItem('allUsers',JSON.stringify(users));cur.status='pending_approval';localStorage.setItem('currentUser',JSON.stringify(cur));alert('✅ Payment sent! Admin will approve.');location.href='guest.html?v=final';}
</script></body></html>
