<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}body{background:#f8fafc;display:flex;justify-content:center;padding:20px}.card{background:#fff;width:100%;max-width:380px;border-radius:20px;padding:20px;border:1px solid #e2e8f0}.inp{width:100%;padding:12px;border:1.5px solid #e2e8f0;border-radius:10px;margin:6px 0}.btn{width:100%;padding:13px;background:#0f172a;color:#fff;border:none;border-radius:10px;font-weight:800;cursor:pointer;margin-top:10px}</style></head><body>
<div class="card"><h2>Create Account</h2><p style="color:#64748b;font-size:12px;margin:4px 0 10px">After this you will pay (Momo/Cash)</p><input id="name" class="inp" placeholder="Full Name"><input id="email" class="inp" placeholder="Email"><input id="phone" class="inp" placeholder="Phone (Momo Number)"><input id="pass" class="inp" type="password" placeholder="Password"><button class="btn" onclick="reg()">Create & Go to Payment →</button><p style="text-align:center;font-size:12px;margin-top:10px"><a href="login.html">Already have account? Login</a></p></div>
<script>
function reg(){
 let n=document.getElementById('name').value.trim(),e=document.getElementById('email').value.trim(),ph=document.getElementById('phone').value.trim(),p=document.getElementById('pass').value.trim();
 if(!n||!e||!p)return alert('Fill all');
 let users=JSON.parse(localStorage.getItem('allUsers')||'[]');if(users.find(u=>u.email===e))return alert('Email exists, login');
 users.push({name:n,email:e,phone:ph,password:p,role:'guest',status:'pending_payment'});localStorage.setItem('allUsers',JSON.stringify(users));
 localStorage.setItem('currentUser',JSON.stringify({name:n,email:e,phone:ph,password:p,role:'guest',status:'pending_payment'}));
 location.href='payment.html';
}
</script></body></html>
