<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register - MiniHotel</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}body{background:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.card{background:#fff;width:100%;max-width:400px;border-radius:24px;padding:26px;box-shadow:0 10px 30px rgba(0,0,0,.06);border:1px solid #eef2f7}.logoRow{display:flex;align-items:center;gap:12px;margin-bottom:18px}.logoBox{width:44px;height:44px;background:#0f172a;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:18px}.brand b{font-size:15px;display:block;line-height:1.2}.brand small{color:#64748b;font-size:11px}h2{font-size:22px;font-weight:800}h2+small{color:#64748b;font-size:12.5px;display:block;margin:4px 0 18px}.input{width:100%;padding:13px;border-radius:12px;border:1.5px solid #e2e8f0;background:#fff;font-size:14px;margin:6px 0}.input:focus{border-color:#2563eb;outline:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;padding:14px;border-radius:12px;border:none;font-weight:800;font-size:14px;margin-top:14px;background:#0f172a;color:#fff;cursor:pointer}.btn:active{transform:scale(.98)}.foot{text-align:center;margin-top:16px;font-size:12px;color:#64748b}.foot a{color:#2563eb;text-decoration:none;font-weight:700}.err{display:none;background:#fef2f2;color:#dc2626;padding:10px;border-radius:10px;font-size:12px;text-align:center;margin-bottom:10px}.ok{display:none;background:#f0fdf4;color:#16a34a;padding:10px;border-radius:10px;font-size:12px;text-align:center;margin-bottom:10px}</style></head><body>
<div class="card">
<div class="logoRow"><div class="logoBox">M</div><div class="brand"><b>MiniHotel Kumasi</b><small>Kumasi • Ghana</small></div><div style="margin-left:auto;font-size:20px">✨</div></div>
<h2>Create Account</h2><small>Join Kumasi MiniHotel • Ghana</small>
<div id="err" class="err"></div>
<div id="ok" class="ok">✅ Account created! Redirecting to login...</div>

<input id="name" class="input" placeholder="Full Name - e.g. Yaw Mickel">
<div class="row"><input id="email" class="input" placeholder="Email"><input id="phone" class="input" placeholder="Phone +233..."></div>
<input id="pass" class="input" type="password" placeholder="Password (min 6)">
<input id="cpass" class="input" type="password" placeholder="Confirm Password">

<button class="btn" onclick="doRegister()">Create Account → Login</button>
<div class="foot">Already have account? <a href="login.html">Login</a><br><br>One login for all: Guest → Guest Page, Admin (admin / MiniHotel2026) → Admin Dashboard</div>
</div>

<script>
function doRegister(){
 const n=document.getElementById('name').value.trim();
 const e=document.getElementById('email').value.trim().toLowerCase();
 const ph=document.getElementById('phone').value.trim();
 const p=document.getElementById('pass').value.trim();
 const cp=document.getElementById('cpass').value.trim();
 const err=document.getElementById('err');
 
 if(!n||!e||!p){err.innerText='❌ Fill Full Name, Email, Password';err.style.display='block';return;}
 if(p.length<4){err.innerText='❌ Password too short (min 4)';err.style.display='block';return;}
 if(p!==cp){err.innerText='❌ Passwords do not match';err.style.display='block';return;}

 let users=JSON.parse(localStorage.getItem('allUsers')||'[]');
 // seed admin if not exists
 if(!users.find(u=>u.email==='admin')){
   users.push({name:'Admin',email:'admin',password:localStorage.getItem('adminPass')||'MiniHotel2026',role:'admin',phone:''});
   users.push({name:'Admin',email:'admin@minihotel.com',password:localStorage.getItem('adminPass')||'MiniHotel2026',role:'admin',phone:''});
 }
 if(users.find(u=>u.email.toLowerCase()===e)){
   err.innerText='❌ Email already exists, go to Login';err.style.display='block';return;
 }
 
 const newUser={name:n,email:e,phone:ph,password:p,role:'guest',created: new Date().toLocaleString()};
 users.push(newUser);
 localStorage.setItem('allUsers',JSON.stringify(users));
 // also set guest info for guest page
 localStorage.setItem('guestFull',n);
 localStorage.setItem('guestEmail',e);
 localStorage.setItem('guestPhone',ph);
 
 document.getElementById('ok').style.display='block';
 err.style.display='none';
 setTimeout(()=>{location.href='login.html?v=registered';},1200);
}
</script></body></html>
