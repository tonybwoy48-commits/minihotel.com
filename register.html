<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book & Create Account</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,system-ui,sans-serif}
body{background:#f6f7fb;padding:16px}
.box{background:#fff;border-radius:20px;padding:20px;max-width:400px;margin:20px auto;box-shadow:0 10px 30px rgba(0,0,0,.08)}
h2{margin-bottom:4px} .sub{color:#6b7280;font-size:13px;margin-bottom:12px}
.chosen{background:#e6edff;color:#1e3a8a;padding:12px;border-radius:12px;font-weight:700;text-align:center;margin-bottom:14px}
label{font-size:12px;font-weight:600;margin:10px 0 4px;display:block}
input,select{width:100%;padding:12px;border:1px solid #e5e7eb;border-radius:12px;font-size:14px;margin-bottom:8px}
.row2{display:flex;gap:8px} .row2 select{width:95px}
.btn{width:100%;background:#2563eb;color:#fff;border:none;padding:13px;border-radius:12px;font-weight:700;margin-top:12px}
a{color:#2563eb;text-decoration:none;font-size:13px;font-weight:600}
</style>
</head>
<body>
<div class="box">
<h2>Create Account & Book 🏨</h2>
<div class="sub">Kumasi, Ghana</div>
<div id="chosen" class="chosen">Loading your room...</div>

<label>Full Name</label>
<input id="name" placeholder="Kwame Asante">

<label>Phone - Ghana +233</label>
<div class="row2">
<select><option>+233</option></select>
<input id="phone" placeholder="24 123 4567">
</div>

<label>Email</label>
<input id="email" placeholder="kwame@gmail.com" type="email">

<label>Password</label>
<input id="pass" type="password" placeholder="Create password">

<button class="btn" onclick="book()">Create Account & Confirm Booking</button>

<p style="text-align:center;margin-top:14px"><a href="index.html">← Choose different room</a></p>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const room = params.get('room') || 'Standard';
const price = params.get('price') || '180';
document.getElementById('chosen').innerHTML = `✅ You chose: ${room} Room<br>GHS ${price} /night`;
function book(){
  alert(`Account created! ${room} booked for GHS ${price}/night. We will call your +233 number.`);
  window.location.href='index.html';
}
</script>
</body>
</html>
