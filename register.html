<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,system-ui,sans-serif}body{background:#f6f7fb}.top{background:#fff;padding:14px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}.top a{width:32px;height:32px;background:#f3f4f6;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#111}.container{max-width:420px;margin:0 auto;padding:16px}.chosen{background:#fff;border-radius:16px;padding:12px;display:flex;gap:12px;box-shadow:0 4px 14px rgba(0,0,0,.06);border:1.5px solid #dbeafe;margin-bottom:16px}.chosen img{width:90px;height:70px;border-radius:10px;object-fit:cover}.box{background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.08)}label{font-size:12px;font-weight:700;margin:12px 0 6px;display:block}input,select{width:100%;padding:12px;border:1.5px solid #e5e7eb;border-radius:12px;font-size:14px}.phoneRow{display:flex;gap:8px}.phoneRow select{width:105px}.btn{width:100%;background:#2563eb;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:800;margin-top:18px}.badge{font-size:12px;background:#ecfdf5;color:#065f46;padding:8px;border-radius:10px;text-align:center;margin-bottom:12px;font-weight:600}</style></head><body><div class="top"><a href="index.html">←</a><b>Create Account & Book</b></div><div class="container"><div class="chosen"><img id="roomImg"><div><span style="background:#2563eb;color:#fff;font-size:10px;padding:3px 8px;border-radius:20px;font-weight:700" id="roomTag">ROOM</span><h3 id="roomName" style="margin-top:4px">Loading</h3><p id="roomPrice" style="font-size:12px;color:#6b7280"></p><p style="font-size:11px;color:#059669">✓ Pay at hotel • Free cancellation</p></div></div><div class="box"><h2>Join MiniHotel 🏨</h2><p style="font-size:13px;color:#6b7280;margin-bottom:12px">Kumasi, Ghana — secure your room</p><div class="badge">🇬🇭 +233 supported • Instant confirmation</div><label>Full Name *</label><input id="fullname" placeholder="Kwame Asante"><label>Phone *</label><div class="phoneRow"><select><option>🇬🇭 +233</option></select><input id="phone" placeholder="24 123 4567"></div><label>Email *</label><input id="email" type="email" placeholder="kwame@gmail.com"><label>Password *</label><input id="pass" type="password" placeholder="Min 6 chars"><label>Confirm *</label><input id="pass2" type="password"><button class="btn" onclick="create()">Create Account & Confirm Booking</button><p style="text-align:center;margin-top:12px;font-size:13px"><a href="login.html" style="color:#2563eb;font-weight:700;text-decoration:none">Have account? Login</a></p></div></div><script>const imgs={Standard:"https://images.unsplash.com/photo-1631049307264-da0ec9d70304?w=400",Deluxe:"https://images.unsplash.com/photo-1566669437687-704479b23c06?w=400",Executive:"https://images.unsplash.com/photo-1590490360182-c33d57733427?w=400",Suite:"https://images.unsplash.com/photo-1578683010236-d716f9a3f461?w=400"};const p=new URLSearchParams(location.search);const room=p.get('room')||'Standard';const price=p.get('price')||'180';document.getElementById('roomName').innerText=room+' Room';document.getElementById('roomTag').innerText=room.toUpperCase();document.getElementById('roomPrice').innerText='GHS '+price+' /night • 2 Guests • 3 Nights';document.getElementById('roomImg').src=imgs[room]||imgs.Standard;function create(){const name=document.getElementById('fullname').value.trim();const phone=document.getElementById('phone').value.trim();const email=document.getElementById('email').value.trim();const p1=document.getElementById('pass').value;const p2=document.getElementById('pass2').value;if(!name||phone.length<9||!email.includes('@')||p1.length<6||p1!==p2){alert('Check all fields — password must match & be 6+ chars');return}localStorage.setItem('guestName',name.split(' ')[0]);localStorage.setItem('guestFull',name);alert(`🎉 Welcome ${name}! ${room} booked GHS ${price}/night. We will call +233${phone}`);location.href='index.html'}</script></body></html>
