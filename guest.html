<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Guest</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}body{background:#f1f5f9;padding:0 0 90px;max-width:480px;margin:0 auto}.top{background:#2563eb;color:#fff;padding:18px;border-radius:0 0 22px 22px;display:flex;justify-content:space-between}.wifi{background:linear-gradient(135deg,#6366f1,#7c3aed);color:#fff;border-radius:18px;padding:14px;margin:12px;display:flex;justify-content:space-between}.card{background:#fff;margin:12px;border-radius:18px;padding:14px;border:1px solid #e2e8f0}.lock{background:#fff;border-radius:18px;padding:24px;text-align:center;margin:20px 12px;border:1px solid #e2e8f0}.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:800;cursor:pointer}.blue{background:#2563eb;color:#fff}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-around;padding:10px 0;font-size:10px}</style></head><body><div id="app"></div>
<div class="bottom"><div onclick="location.href='guest.html'"><div>👤</div><b style="color:#2563eb">Guest</b></div><div onclick="alert('Front Desk: 055 123 4567')"><div>💬</div>Support</div><div onclick="checkout()"><div>🚪</div>Check-Out</div><div onclick="logout()"><div>🔓</div>Logout</div></div>
<script>
let cur=JSON.parse(localStorage.getItem('currentUser')||'null');if(!cur)location.href='login.html';
let users=JSON.parse(localStorage.getItem('allUsers')||'[]');let me=users.find(u=>u.email===cur.email)||cur;
let status=me.status;
function render(){
 if(status==='pending_payment'){document.getElementById('app').innerHTML=`<div class="lock"><h2>Payment Needed</h2><p style="color:#64748b;font-size:13px;margin:8px 0">Complete Momo/Cash payment first</p><button class="btn blue" onclick="location.href='payment.html'">Go to Payment</button></div>`;}
 else if(status==='pending_approval'){document.getElementById('app').innerHTML=`<div class="lock"><div style="font-size:40px">⏳</div><h2>Waiting Approval</h2><p style="color:#64748b;font-size:12px;margin:8px 0">Hi ${me.name}, payment received.<br>Admin will approve after checking Momo.<br>Visit front desk Kumasi.</p><div style="background:#f8fafc;padding:10px;border-radius:10px;margin:10px 0;font-size:12px">Room: ${localStorage.getItem('wantedRoom')||'Standard'} • Pending</div><button class="btn blue" onclick="location.href='payment.html'">View Payment</button></div>`;}
 else{let wn=localStorage.getItem('adminWifiName')||'MiniHotel_Guest_5G';let wp=localStorage.getItem('adminWifiPass')||'Kumasi@2026';let pr=JSON.parse(localStorage.getItem('roomPrices')||'{"Standard":180}');let room=localStorage.getItem('wantedRoom')||'Standard';document.getElementById('app').innerHTML=`<div class="top"><div><small>MiniHotel Kumasi ✅ Approved</small><h2>Hi, ${me.name.split(' ')[0]} 👋</h2><small>${me.email}</small></div><div style="width:40px;height:40px;background:#fff;color:#2563eb;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900">${me.name[0].toUpperCase()}</div></div><div class="wifi"><div><small>📶 GUEST WIFI</small><br><b>${wn}</b><br><small style="background:rgba(255,255,255,.2);padding:4px 8px;border-radius:6px">${wp}</small> <button onclick="navigator.clipboard.writeText('${wp}');alert('Copied')" style="background:#fff;color:#4f46e5;border:none;padding:4px 8px;border-radius:6px;font-size:10px;font-weight:800">Copy</button></div><div style="background:#fff;color:#4f46e5;border-radius:10px;padding:10px;font-weight:800;text-align:center">QR<br>WIFI</div></div><div class="card"><b>Current Booking ● CHECKED IN</b><div style="height:160px;background:url('https://images.unsplash.com/photo-1631049307264-da0ec9d70304?w=600') center/cover;border-radius:12px;margin:10px 0"></div><b>${room} - Floor 2</b><br><small style="color:#64748b">Kumasi, Ghana</small><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><div style="background:#f8fafc;padding:10px;border-radius:10px"><small>Check-In</small><br><b>Today</b></div><div style="background:#f8fafc;padding:10px;border-radius:10px"><small>Total</small><br><b>GHS ${pr[room]*3||540}</b></div></div><button class="btn blue" style="margin-top:10px" onclick="alert('Call Front Desk: 055 123 4567')">📞 Contact Front Desk</button><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><button class="btn" style="background:#fff;border:1px solid #e2e8f0" onclick="checkout()">🚪 Check-Out</button><button class="btn" style="background:#fee2e2;color:#dc2626" onclick="logout()">Logout</button></div></div>`;}
}
function checkout(){if(confirm('Check-Out?')){localStorage.removeItem('wantedRoom');location.href='index.html';}}
function logout(){localStorage.removeItem('currentUser');location.href='login.html';}
render();
</script></body></html>
