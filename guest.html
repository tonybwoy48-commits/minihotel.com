<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Guest - MiniHotel</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}body{background:#f1f5f9;padding-bottom:90px}.top{background:#2563eb;color:#fff;padding:18px 18px 20px;border-radius:0 0 22px 22px;display:flex;justify-content:space-between;align-items:center}.top small{opacity:.8;font-size:11px}.avatar{width:44px;height:44px;background:#fff;color:#2563eb;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px}.wifi{background:linear-gradient(135deg,#6366f1,#7c3aed);color:#fff;border-radius:18px;padding:14px;margin:12px;display:flex;justify-content:space-between;align-items:center}.wifi b{font-size:15px}.copyBtn{background:#fff;color:#4f46e5;border:none;padding:6px 12px;border-radius:8px;font-weight:800;font-size:11px;margin-top:6px;cursor:pointer}.qr{background:#fff;color:#2563eb;border-radius:12px;padding:10px 14px;font-weight:900;font-size:11px;text-align:center}.card{background:#fff;margin:12px;border-radius:18px;padding:14px;border:1px solid #e2e8f0}.roomImg{width:100%;height:180px;border-radius:14px;background:url('https://images.unsplash.com/photo-1631049307264-da0ec9d70304?w=700') center/cover;margin-bottom:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.box{background:#f8fafc;border:1px solid #eef2f7;border-radius:12px;padding:10px}.box small{color:#64748b;font-size:10px}.box b{font-size:13px;display:block;margin-top:2px}.btnBlue{width:100%;background:#2563eb;color:#fff;border:none;padding:14px;border-radius:14px;font-weight:800;margin-top:12px;cursor:pointer}.btnRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.btnOut{background:#fff;border:1.5px solid #e2e8f0;padding:12px;border-radius:12px;font-weight:800;cursor:pointer}.btnLogout{background:#fee2e2;color:#dc2626;border:none;padding:12px;border-radius:12px;font-weight:800;cursor:pointer}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-around;padding:10px 0}.bottom div{text-align:center;font-size:10px;color:#94a3b8;cursor:pointer}.bottom b{color:#2563eb}</style></head><body>
<div class="top"><div><small>🇬🇭 MiniHotel Kumasi</small><h2 id="gName" style="font-size:22px;margin:2px 0">Hi, Yaw 👋</h2><small id="gFull">Yaw peter</small></div><div class="avatar" id="gAvatar">Y</div></div>

<div class="wifi"><div><small>📶 GUEST WIFI</small><br><b id="wName">MiniHotel_Guest_5G</b><br><div style="display:flex;gap:6px;margin-top:6px"><span id="wPass" style="background:rgba(255,255,255,.2);padding:5px 10px;border-radius:8px;font-size:11px">Kumasi@2026</span><button class="copyBtn" onclick="copyWifi()">Copy</button></div></div><div class="qr">QR<br>WIFI</div></div>

<div class="card">
<b style="font-size:16px">Current Booking ● CHECKED IN</b>
<div class="roomImg"></div>
<b id="roomName" style="font-size:16px">Standard Room - Floor 2</b><br><small style="color:#64748b">Kumasi, Ghana 📍</small>
<div class="grid2">
<div class="box"><small>Check-In</small><b id="checkIn">Nov 5</b></div>
<div class="box"><small>Check-Out</small><b id="checkOut">Nov 8</b></div>
<div class="box"><small>Guests</small><b>2 Guests</b></div>
<div class="box"><small>Total</small><b id="total">GHS 540</b></div>
</div>
<button class="btnBlue" onclick="contactDesk()">📞 Contact Front Desk</button>
<div class="btnRow"><button class="btnOut" onclick="checkOut()">🚪 Check-Out</button><button class="btnLogout" onclick="doLogout()">Logout</button></div>
</div>

<div class="bottom"><div onclick="location.href='guest.html'"><div>👤</div><b>Guest</b></div><div onclick="contactDesk()"><div>💬</div>Support</div><div onclick="checkOut()"><div>🚪</div>Check-Out</div><div onclick="doLogout()"><div>🚪</div>Logout</div></div>

<script>
try{let cur=JSON.parse(localStorage.getItem('currentUser')||'null');if(!cur){location.href='login.html';}else{document.getElementById('gName').innerText='Hi, '+(cur.name.split(' ')[0]||'Guest')+' 👋';document.getElementById('gFull').innerText=cur.name||cur.email;document.getElementById('gAvatar').innerText=(cur.name||'G')[0].toUpperCase();}}catch(e){location.href='login.html';}
(function(){
 let wn=localStorage.getItem('adminWifiName')||'MiniHotel_Guest_5G';
 let wp=localStorage.getItem('adminWifiPass')||'Kumasi@2026';
 document.getElementById('wName').innerText=wn;document.getElementById('wPass').innerText=wp;
 let wanted=localStorage.getItem('wantedRoom')||'Standard';
 let prices=JSON.parse(localStorage.getItem('roomPrices')||'{"Standard":180,"Deluxe":250,"Executive":300,"Suite":450}');
 let price=prices[wanted]||180;
 let total=price*3;
 document.getElementById('roomName').innerText=wanted+' Room - Floor 2';
 document.getElementById('total').innerText='GHS '+total;
 // dates
 let d=new Date();document.getElementById('checkIn').innerText=d.toLocaleDateString('en-US',{month:'short',day:'numeric'});let out=new Date();out.setDate(d.getDate()+3);document.getElementById('checkOut').innerText=out.toLocaleDateString('en-US',{month:'short',day:'numeric'});
})();
function copyWifi(){let p=document.getElementById('wPass').innerText;navigator.clipboard.writeText(p);alert('✅ WiFi Password Copied: '+p);}
function contactDesk(){let cur=JSON.parse(localStorage.getItem('currentUser')||'{}');let msg=prompt('Message Front Desk:');if(!msg)return;let all=JSON.parse(localStorage.getItem('guestMessages')||'[]');all.push({name:cur.name||cur.email,msg:msg,time:new Date().toLocaleString()});localStorage.setItem('guestMessages',JSON.stringify(all));alert('✅ Message sent to Admin!');}
function checkOut(){if(confirm('Check-Out? Your booking will end.')){localStorage.removeItem('wantedRoom');alert('✅ Checked Out! Thank you for staying at MiniHotel Kumasi 🇬🇭');location.href='index.html';}}
function doLogout(){if(confirm('Logout?')){localStorage.removeItem('currentUser');localStorage.removeItem('guestLoggedIn');location.href='login.html';}}
</script></body></html>
