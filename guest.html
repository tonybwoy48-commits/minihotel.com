<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Guest</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#f1f5f9;padding:16px}.card{background:#fff;padding:16px;border-radius:12px;margin-bottom:12px;border:1px solid #e2e8f0}.btn{padding:8px 14px;border-radius:8px;border:none;font-weight:700;cursor:pointer}</style></head><body>
<div class="card" style="background:#1e293b;color:#fff"><b>Welcome, <span id="gName"></span></b><br><small id="gEmail"></small></div>
<div class="card" id="statusBox"></div>
<div class="card"><b>📶 Your WiFi</b><div id="wifiBox" style="margin-top:8px"></div></div>
<div style="text-align:center"><button onclick="localStorage.removeItem('currentUser');location.href='index.html'" class="btn" style="background:#fee2e2">Logout</button></div>
<script>
let cur=JSON.parse(localStorage.getItem('currentUser')||'null');if(!cur)location.href='login.html';document.getElementById('gName').innerText=cur.name||cur.email;document.getElementById('gEmail').innerText=cur.email;let pays=JSON.parse(localStorage.getItem('payments')||'[]').filter(p=>p.email==cur.email);let last=pays[pays.length-1];if(!last){document.getElementById('statusBox').innerHTML='❌ No booking yet';}else if(last.status=='pending'){document.getElementById('statusBox').innerHTML=`<b>Status: ⏳ Pending Approval</b><br><small>Room: ${last.room} - GHS ${last.amount}<br>Admin will approve your ${last.method} payment soon. WiFi will show after approval.</small>`;document.getElementById('wifiBox').innerHTML='<small style="color:#ca8a04">⏳ Wait for admin approval</small>';}else{document.getElementById('statusBox').innerHTML=`<b>Status: ✅ Approved</b><br><small>Room: ${last.room} - GHS ${last.amount} - Enjoy your stay!</small>`;let wN=localStorage.getItem('adminWifiName')||'MiniHotel_Guest_5G';let wP=localStorage.getItem('adminWifiPass')||'Kumasi@2026';document.getElementById('wifiBox').innerHTML=`<div style="background:#f0fdf4;padding:12px;border-radius:8px"><b>WiFi Name:</b> ${wN}<br><b>Password:</b> ${wP}<br><button class="btn" style="background:#16a34a;color:#fff;margin-top:8px;width:100%" onclick="navigator.clipboard.writeText('${wP}');alert('Password copied!')">Copy Password</button></div>`;}
</script></body></html>
